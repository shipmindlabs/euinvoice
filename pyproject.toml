[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "euinvoice"
version = "0.1.0"
description = "Invoice PDFs for EU sellers: domestic VAT, private buyers and reverse charge, with sequential numbering."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shipmind Labs", email = "hello@shipmindlabs.com" }]
keywords = ["invoice", "vat", "eu", "pdf", "reverse-charge"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shipmindlabs/euinvoice"
Source = "https://github.com/shipmindlabs/euinvoice"
Issues = "https://github.com/shipmindlabs/euinvoice/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/euinvoice"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
